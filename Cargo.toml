[package]
name = "gitu"
description = "A git client inspired by Magit"
version = "0.42.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/altsem/gitu"

[[bench]]
name = "show"
harness = false

[dev-dependencies]
pretty_assertions = "1.4.1"
temp-dir = "0.1.16"
criterion = "0.8.1"
insta = "1.46.0"
unicode-width = "0.2.0"
temp-env = "0.3.6"
stdext = "0.3.3"
url = "2.5.7"

[profile.profiling]
inherits = "dev"
opt-level = 1

[profile.release]
strip = true

[dependencies]
anstyle-parse = "0.2.7"
arboard = { version = "3.6.1", default-features = false, features = [
    "windows-sys",
] }
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
# `use-dev-tty` reads keys through poll(2) on the terminal rather than through
# mio. Gitu needs it to be usable as a pager: with a patch on stdin the keyboard
# has to come from /dev/tty, and macOS kqueue refuses to register that device,
# so mio's event source cannot be built at all.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
etcetera = "0.11.0"
figment = { version = "0.10.19", features = ["toml"] }
git-version = "0.3.9"
git2 = { version = "0.20.2", default-features = false }
itertools = "0.14.0"
log = "0.4.28"
nom = "8.0.0"
notify = "8.0.0"
serde = { version = "1.0.225", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm_0_29",
    "layout-cache",
    "serde",
] }
simple-logging = "2.0.2"
toml = "0.8.23"
tui-prompts = "0.6.7"
tree-sitter = "=0.25.6"
tree-sitter-highlight = "=0.25.6"
tree-sitter-rust = "=0.24.0"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-javascript = "=0.23.1"
tree-sitter-c = "=0.24.1"
tree-sitter-json = "=0.24.8"
tree-sitter-cpp = "=0.23.4"
tree-sitter-ruby = "=0.23.1"
tree-sitter-haskell = "=0.23.1"
tree-sitter-go = "=0.23.4"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-python = "=0.23.6"
tree-sitter-typescript = "=0.23.2"
tree-sitter-bash = "=0.25.0"
tree-sitter-php = "=0.23.11"
tree-sitter-java = "=0.23.5"
tree-sitter-scala = "=0.23.4"
tree-sitter-ocaml = "=0.24.2"
tree-sitter-html = "=0.23.2"
tree-sitter-elixir = "=0.3.4"
regex = "1.12.2"
strip-ansi-escapes = "0.2.1"
unicode-segmentation = "1.12.0"
cached = "0.56.0"
strum = { version = "0.26.3", features = ["derive"] }
tinyvec = "1.10.0"
smashquote = "0.1.2"
imara-diff = { version = "0.2.0", default-features = false }
fuzzy-matcher = "0.3.7"
url = "2.5.7"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
shell-words = "1.1"
