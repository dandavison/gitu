[package]
name = "delta-gitu"
description = "An experimental fork of gitu (a git client inspired by Magit), published as a library for delta to embed"
version = "0.1.12"
edition = "2024"
license = "MIT"
repository = "https://github.com/dandavison/gitu"

[lib]
name = "gitu"

# This crate exists for delta to embed as `delta --gitu`, so it has no binary.

[[bench]]
name = "show"
harness = false

[[bench]]
name = "ui"
harness = false

[dev-dependencies]
pretty_assertions = "1.4.1"
temp-dir = "0.1.16"
criterion = "0.8.1"
insta = "1.46.0"
temp-env = "0.3.6"
stdext = "0.3.3"
url = "2.5.7"

[profile.release]
strip = true

[dependencies]
anstyle-parse = "0.2.7"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control", "windows-sys"] }
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
# `use-dev-tty` reads keys through poll(2) on the terminal rather than through
# mio. Gitu needs it to be usable as a pager: with a patch on stdin the keyboard
# has to come from /dev/tty, and macOS kqueue refuses to register that device,
# so mio's event source cannot be built at all.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
etcetera = "0.11.0"
figment = { version = "0.10.19", features = ["toml"] }
git2 = { version = "0.20.2", default-features = false }
itertools = "0.14.0"
log = "0.4.28"
nom = "8.0.0"
notify = "8.0.0"
serde = { version = "1.0.225", features = ["derive"] }
toml = "0.8.23"
regex = "1.12.2"
strip-ansi-escapes = "0.2.1"
unicode-segmentation = "1.12.0"
strum = { version = "0.26.3", features = ["derive"] }
tinyvec = "1.10.0"
smashquote = "0.1.2"
fuzzy-matcher = "0.3.7"
unicode-width = "0.2.0"
url = "2.5.7"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
shell-words = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.178"
