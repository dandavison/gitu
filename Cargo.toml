[package]
name = "delta-gitu"
description = "An experimental fork of gitu (a git client inspired by Magit), published as a library for delta to embed"
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/dandavison/gitu"

[lib]
name = "gitu"

# This crate exists for delta to embed, not as a second way to install gitu, so
# it has no binary target: crates.io would then advertise `cargo install
# delta-gitu`. The former binary is an example, run with `cargo run --example gitu`.

[[bench]]
name = "show"
harness = false

[[bench]]
name = "ui"
harness = false

[dev-dependencies]
pretty_assertions = "1.4.1"
temp-dir = "0.1.16"
criterion = "0.8.1"
insta = "1.46.0"
temp-env = "0.3.6"
stdext = "0.3.3"
url = "2.5.7"

[profile.profiling]
inherits = "dev"
opt-level = 1

[profile.release]
strip = true

[features]
default = ["syntax-highlighting"]
# gitu's own syntax highlighting of diffs and blame. Its tree-sitter grammars
# make up most of the binary, and a host whose diff renderer highlights does not
# need them.
syntax-highlighting = ["dep:tree-sitter", "dep:tree-sitter-highlight", "dep:tree-sitter-rust", "dep:tree-sitter-toml-ng", "dep:tree-sitter-javascript", "dep:tree-sitter-c", "dep:tree-sitter-json", "dep:tree-sitter-cpp", "dep:tree-sitter-ruby", "dep:tree-sitter-haskell", "dep:tree-sitter-go", "dep:tree-sitter-c-sharp", "dep:tree-sitter-python", "dep:tree-sitter-typescript", "dep:tree-sitter-bash", "dep:tree-sitter-php", "dep:tree-sitter-java", "dep:tree-sitter-scala", "dep:tree-sitter-ocaml", "dep:tree-sitter-html", "dep:tree-sitter-elixir"]

[dependencies]
anstyle-parse = "0.2.7"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control", "windows-sys"] }
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5.58"
# `use-dev-tty` reads keys through poll(2) on the terminal rather than through
# mio. Gitu needs it to be usable as a pager: with a patch on stdin the keyboard
# has to come from /dev/tty, and macOS kqueue refuses to register that device,
# so mio's event source cannot be built at all.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
etcetera = "0.11.0"
figment = { version = "0.10.19", features = ["toml"] }
git-version = "0.3.9"
git2 = { version = "0.20.2", default-features = false }
itertools = "0.14.0"
log = "0.4.28"
nom = "8.0.0"
notify = "8.0.0"
serde = { version = "1.0.225", features = ["derive"] }
simple-logging = "2.0.2"
toml = "0.8.23"
tree-sitter = { version = "=0.25.6", optional = true }
tree-sitter-highlight = { version = "=0.25.6", optional = true }
tree-sitter-rust = { version = "=0.24.0", optional = true }
tree-sitter-toml-ng = { version = "=0.7.0", optional = true }
tree-sitter-javascript = { version = "=0.23.1", optional = true }
tree-sitter-c = { version = "=0.24.1", optional = true }
tree-sitter-json = { version = "=0.24.8", optional = true }
tree-sitter-cpp = { version = "=0.23.4", optional = true }
tree-sitter-ruby = { version = "=0.23.1", optional = true }
tree-sitter-haskell = { version = "=0.23.1", optional = true }
tree-sitter-go = { version = "=0.23.4", optional = true }
tree-sitter-c-sharp = { version = "=0.23.1", optional = true }
tree-sitter-python = { version = "=0.23.6", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }
tree-sitter-bash = { version = "=0.25.0", optional = true }
tree-sitter-php = { version = "=0.23.11", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
tree-sitter-scala = { version = "=0.23.4", optional = true }
tree-sitter-ocaml = { version = "=0.24.2", optional = true }
tree-sitter-html = { version = "=0.23.2", optional = true }
tree-sitter-elixir = { version = "=0.3.4", optional = true }
regex = "1.12.2"
strip-ansi-escapes = "0.2.1"
unicode-segmentation = "1.12.0"
cached = "0.56.0"
strum = { version = "0.26.3", features = ["derive"] }
tinyvec = "1.10.0"
smashquote = "0.1.2"
imara-diff = { version = "0.2.0", default-features = false }
fuzzy-matcher = "0.3.7"
unicode-width = "0.2.0"
url = "2.5.7"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
shell-words = "1.1"
