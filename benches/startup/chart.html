<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitu startup history</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --panel: #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #8a8984;
  --grid: #e7e6e2;
  --series: #2a78d6;
  --baseline: #8a8984;
  --band: rgba(42, 120, 214, 0.16);
  --error: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19;
    --panel: #222221;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --grid: #33332f;
    --series: #3987e5;
    --baseline: #a3a29b;
    --band: rgba(57, 135, 229, 0.22);
    --error: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --panel: #222221;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --grid: #33332f;
  --series: #3987e5;
  --baseline: #a3a29b;
  --band: rgba(57, 135, 229, 0.22);
  --error: #e66767;
}
body { margin: 0; background: var(--surface); color: var(--text-primary); font: 14px/1.4 system-ui, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.meta { color: var(--text-secondary); margin: 0 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--grid); border-radius: 8px; padding: 12px; position: relative; }
.panel h2 { font-size: 14px; margin: 0 0 6px; font-family: ui-monospace, monospace; }
.legend { display: flex; gap: 16px; color: var(--text-secondary); font-size: 12px; margin: 0 0 16px; }
.legend span::before { content: ""; display: inline-block; width: 16px; margin-right: 6px; vertical-align: middle; border-top: 2px solid var(--series); }
.legend .base::before { border-top: 2px dashed var(--baseline); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-muted); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--grid); border-radius: 6px;
  padding: 6px 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 320px; display: none; z-index: 1; }
.tip strong { display: block; font-size: 15px; }
.tip .sub { color: var(--text-secondary); font-size: 12px; }
details { margin-top: 24px; }
table { border-collapse: collapse; font-size: 12px; width: 100%; }
th, td { border-bottom: 1px solid var(--grid); padding: 3px 6px; text-align: right; white-space: nowrap; }
th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
td.subject { white-space: normal; color: var(--text-secondary); }
.table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
<h1>Time to first screen draw, by commit</h1>
<p class="meta" id="meta"></p>
<div class="legend"><span>gitu as git's pager (status: gitu alone)</span><span class="base">delta + less (no gitu), to less's first screen</span></div>
<div class="grid" id="grid"></div>
<details><summary>Table (mean ms)</summary><div class="table-wrap"><table id="table"></table></div></details>
</main>
<script>
const DATA = /*DATA*/null;
const CASES = ["status", "diff", "diff --stat", "show", "log", "log -p"];
const W = 520, H = 200, M = { l: 44, r: 8, t: 8, b: 20 };
const NS = "http://www.w3.org/2000/svg";
// Every case but status shares a y-axis; slower points are clipped, with values in the tooltip.
const YMAX_MS = 200;

const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const ms = s => s * 1000;
const short = r => r.commit.slice(0, 7);

const machines = [...new Set(DATA.map(r => r.machine).filter(Boolean))];
const deltas = [...new Set(DATA.map(r => r.delta).filter(Boolean))];
document.getElementById("meta").textContent =
  `${DATA.length} commits · ${machines.join(", ")} · ${deltas.join(", ")} · terminal ${DATA[0]?.terminal ?? ""}. ` +
  "Line: mean of hyperfine runs; band: min–max. Gaps: case unsupported or failed at that commit.";

for (const name of CASES) panel(name);
table();

function panel(name) {
  const div = document.createElement("div");
  div.className = "panel";
  const h = document.createElement("h2");
  h.textContent = name;
  div.appendChild(h);
  document.getElementById("grid").appendChild(div);

  const pts = DATA.map((r, i) => ({ i, r, c: r.cases?.[name] }));
  const base = DATA.map((r, i) => ({ i, r, c: r.baseline?.[name] }));
  const ok = [...pts, ...base].filter(p => p.c && p.c.mean !== undefined);
  const top = name === "status" ? Math.max(1, ...ok.map(p => ms(p.c.max))) : YMAX_MS;
  const step = tickStep(top);
  const ymax = Math.ceil(top / step) * step;
  const x = i => M.l + (DATA.length < 2 ? 0 : (i / (DATA.length - 1)) * (W - M.l - M.r));
  const y = v => H - M.b - (v / ymax) * (H - M.t - M.b);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${name} time to first draw by commit` }, div);

  for (let v = 0; v <= ymax; v += step) {
    el("line", { x1: M.l, x2: W - M.r, y1: y(v), y2: y(v), stroke: "var(--grid)" }, svg);
    el("text", { x: M.l - 6, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = `${Math.round(v)}`;
  }
  el("text", { x: W - M.r, y: H - 4, "text-anchor": "end" }, svg).textContent = "ms · commits →";
  const clip = `clip-${CASES.indexOf(name)}`;
  el("rect", { x: 0, y: M.t, width: W, height: H - M.t - M.b }, el("clipPath", { id: clip }, svg));
  const plot = el("g", { "clip-path": `url(#${clip})` }, svg);

  for (const run of runs(base))
    el("polyline", { points: run.map(p => `${x(p.i)},${y(ms(p.c.mean))}`).join(" "),
      fill: "none", stroke: "var(--baseline)", "stroke-width": 2, "stroke-dasharray": "4 3" }, plot);
  for (const run of runs(pts)) {
    const top = run.map(p => `${x(p.i)},${y(ms(p.c.max))}`);
    const bot = run.map(p => `${x(p.i)},${y(ms(p.c.min))}`).reverse();
    el("polygon", { points: [...top, ...bot].join(" "), fill: "var(--band)" }, plot);
    el("polyline", { points: run.map(p => `${x(p.i)},${y(ms(p.c.mean))}`).join(" "),
      fill: "none", stroke: "var(--series)", "stroke-width": 2, "stroke-linejoin": "round" }, plot);
    if (run.length === 1) el("circle", { cx: x(run[0].i), cy: y(ms(run[0].c.mean)), r: 3, fill: "var(--series)" }, plot);
  }
  for (const p of pts.filter(p => p.c?.error || p.r.build_error))
    el("text", { x: x(p.i), y: H - M.b - 2, "text-anchor": "middle", style: "fill: var(--error)" }, svg).textContent = "×";

  const hair = el("line", { y1: M.t, y2: H - M.b, stroke: "var(--text-muted)", "stroke-width": 1, visibility: "hidden" }, svg);
  const dot = el("circle", { r: 4, fill: "var(--series)", stroke: "var(--panel)", "stroke-width": 2, visibility: "hidden" }, plot);
  const tip = document.createElement("div");
  tip.className = "tip";
  div.appendChild(tip);
  const hit = el("rect", { x: M.l, y: 0, width: W - M.l - M.r, height: H, fill: "transparent" }, svg);
  hit.addEventListener("pointermove", ev => {
    const box = svg.getBoundingClientRect();
    const sx = ((ev.clientX - box.left) / box.width) * W;
    const i = Math.max(0, Math.min(DATA.length - 1, Math.round(((sx - M.l) / (W - M.l - M.r)) * (DATA.length - 1))));
    const p = pts[i];
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.setAttribute("visibility", "visible");
    if (p.c?.mean !== undefined) {
      dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(ms(p.c.mean))); dot.setAttribute("visibility", "visible");
    } else dot.setAttribute("visibility", "hidden");
    tip.replaceChildren();
    const strong = document.createElement("strong");
    strong.textContent = p.c?.mean !== undefined
      ? `${ms(p.c.mean).toFixed(1)} ms ± ${ms(p.c.stddev).toFixed(1)}`
      : p.r.build_error ? "build failed" : p.c?.error ? "failed" : "unsupported";
    const range = document.createElement("div");
    range.className = "sub";
    range.textContent = p.c?.mean !== undefined ? `min ${ms(p.c.min).toFixed(1)} · max ${ms(p.c.max).toFixed(1)}` : "";
    const commit = document.createElement("div");
    commit.className = "sub";
    const b = base[i].c;
    const delta = document.createElement("div");
    delta.className = "sub";
    delta.textContent = b?.mean !== undefined ? `delta + less ${ms(b.mean).toFixed(1)} ms` : "";
    commit.textContent = `${short(p.r)} ${p.r.subject ?? ""}`;
    tip.append(strong, range, delta, commit);
    tip.style.display = "block";
    const px = (x(i) / W) * box.width;
    tip.style.left = `${Math.min(px + 16, box.width - tip.offsetWidth)}px`;
    tip.style.top = `${36}px`;
  });
  hit.addEventListener("pointerleave", () => {
    tip.style.display = "none";
    hair.setAttribute("visibility", "hidden");
    dot.setAttribute("visibility", "hidden");
  });
}

function runs(pts) {
  const out = [];
  let cur = [];
  for (const p of pts) {
    if (p.c && p.c.mean !== undefined) cur.push(p);
    else if (cur.length) { out.push(cur); cur = []; }
  }
  if (cur.length) out.push(cur);
  return out;
}

// The smallest round step that spans v in at most five gridlines above zero.
function tickStep(v) {
  const pow = 10 ** Math.floor(Math.log10(v / 5));
  for (const m of [1, 2, 2.5, 5, 10]) if (Math.ceil(v / (m * pow)) <= 5) return m * pow;
}

function table() {
  const t = document.getElementById("table");
  const head = t.insertRow();
  for (const h of ["commit", "subject", ...CASES]) {
    const th = document.createElement("th");
    th.textContent = h;
    head.appendChild(th);
  }
  for (const r of DATA) {
    const row = t.insertRow();
    row.insertCell().textContent = short(r);
    const s = row.insertCell();
    s.className = "subject";
    s.textContent = r.subject ?? "";
    for (const name of CASES) {
      const c = r.cases?.[name];
      row.insertCell().textContent = c?.mean !== undefined ? ms(c.mean).toFixed(1) : c?.error ? "failed" : r.build_error ? "build failed" : "—";
    }
  }
}
</script>
</body>
</html>
