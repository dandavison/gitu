rebase_todo.rebase_todo_move_up = ["alt+k", "alt+up"]
rebase_todo.rebase_todo_move_down = ["alt+j", "alt+down"]
rebase_todo.rebase_todo_start = ["enter"]
rebase_todo.move_up = ["k", "up"]
rebase_todo.move_down = ["j", "down"]
rebase_todo.move_top = ["g+g"]
rebase_todo.move_bottom = ["G"]
rebase_todo.half_page_up = ["ctrl+u"]
rebase_todo.half_page_down = ["ctrl+d"]
rebase_todo.scroll_view_up = ["ctrl+y"]
rebase_todo.scroll_view_down = ["ctrl+e"]
rebase_todo.toggle_section = ["tab"]
rebase_todo.toggle_menu = ["h", "?"]
# When git is waiting on gitu as its sequence editor, leaving calls
# the rebase off.
rebase_todo.quit = ["q", "esc"]

root.remote_menu=["M"]
remote_menu.add_remote=["a"]
remote_menu.remove_remote=["K"]
remote_menu.rename_remote=["r"]
