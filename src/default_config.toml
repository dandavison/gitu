# This file contains Gitu's default configuration.
# It is possible to override settings with an equivalent file at:
# `~/.config/gitu/config.toml`

[general]
always_show_help.enabled = false
confirm_quit.enabled = false
# Sets initially collapsed sections in the editor. e.g.:
# collapsed_sections = ["untracked", "recent_commits", "branch_status"]
collapsed_sections = []
refresh_on_file_change.enabled = true
stash_list_limit = 10
recent_commits_limit = 10
mouse_support = false
mouse_scroll_lines = 3

# Colorize diffs with an external command (e.g. delta) instead of Gitu's
# built-in syntax/diff highlighting. The command receives a unified diff on
# stdin and emits ANSI-colored output.
#
# Gitu advertises the OSC-1717 diff-line-metadata protocol to the command (via
# the OSC1717_METADATA env var). If the renderer speaks it, the diff may be
# rendered freely — dropping +/- markers, side-by-side, gutters — and Gitu maps
# each rendered row back to its patch line for staging. If it doesn't, the
# command must preserve line structure (`--color-only`), which Gitu maps 1:1.
#
# A `{width}` token in the command is replaced with the number of columns Gitu
# will render into (and COLUMNS is exported), so a reflowing renderer fills the
# viewport rather than defaulting too narrow over the pipe.
#
# The default is structure-preserving so it works either way; a renderer that
# speaks OSC-1717 can be run freely, e.g.:
#   diff_colorizer.command = ["delta", "--side-by-side", "--width", "{width}"]
diff_colorizer.enabled = false
diff_colorizer.command = ["delta", "--color-only", "--no-gitconfig", "--true-color", "always"]

# Renderer features that `renderer_features` offers, to turn on and off while
# viewing a diff. They are passed to the renderer as DELTA_FEATURES=+<names>,
# which delta adds to the features your own git config already sets: your
# configuration stays the base and this is only an overlay on it, held for the
# session and never written to disk.
#
# Any feature you have defined in git config as `[delta "name"]` can be named
# here alongside delta's built-in ones. A feature is free to restructure the
# diff however it likes: Gitu maps each rendered row back to its patch line from
# the metadata the renderer emits, not from how the row looks.
diff_colorizer.features = ["side-by-side", "line-numbers", "hyperlinks"]

# Render the log view with a command of your own instead of Gitu's built-in
# one-line-per-commit list. The command is run in the repository and its
# ANSI-colored output becomes the log view; Gitu appends the log menu's
# arguments (`-n`, `--grep`) and the rev being logged.
#
# A commit may take as many rows as the format prints (blank separators, a stat,
# a graph): Gitu keeps them one unit — one commit per cursor stop, folded and
# operated on together — by identifying them from a marker the format emits.
# The `{commit}` token, which must appear in the format, is substituted with git
# format directives emitting that marker (an OSC-1717 commit record); if it is
# missing, Gitu falls back to the built-in log.
#
# A `{width}` token is substituted as for `diff_colorizer`, so the output can be
# piped through a renderer that reflows, e.g.:
#   log_renderer.command = ["sh", "-c", "git log --stat --color=always --format='{commit}%h %s' \"$@\" | delta --width {width}", "gitu"]
log_renderer.enabled = false
log_renderer.command = [
  "git", "log", "--color=always", "--date=relative",
  "--format={commit}%n%n▸ %h %C(blue)%an %C(blue)%ar%C(auto)%d%C(reset)%n%n    %C(green)%s%C(auto)",
]

# When to prompt for discard confirmation. Options:
# "line"  - always prompt even for individual lines (default),
# "hunk"  - prompt for files and hunks,
# "file"  - only prompt when discarding whole files,
# "never" - never prompt when discarding.
confirm_discard = "line"

[style]
# fg / bg can be either of:
# - a hex value: "#707070"
# - an ansi color name: "light blue"
# - an ansi color index: "255"
# - "reset" will set the terminal's default foreground / background color.

# 'mods' can be any combination of (multiple values separated by '|'):
# "BOLD|DIM|ITALIC|UNDERLINED|SLOW_BLINK|RAPID_BLINK|REVERSED|HIDDEN|CROSSED_OUT"

# Example style config values:
# section_header = { fg = "#808080" }
# section_header = { bg = "light green", mods = "UNDERLINED|ITALIC" }

separator = { mods = "DIM" }

info_msg = { fg = "green", mods = "BOLD" }
error_msg = { fg = "red", mods = "BOLD" }
command = { fg = "blue", mods = "BOLD" }

menu.heading = { fg = "blue", mods = "BOLD" }
menu.key = { fg = "magenta" }
menu.active_arg = { fg = "light red", mods = "BOLD" }
menu.inactive_arg = {}

prompt = { fg = "cyan", mods = "DIM" }

section_header = { fg = "yellow" }
file_header = { fg = "magenta" }
hunk_header = { fg = "blue" }

diff_highlight.tag_old = { fg = "red", mods = "BOLD" }
diff_highlight.tag_new = { fg = "green", mods = "BOLD" }
diff_highlight.unchanged_old = { mods = "DIM" }
diff_highlight.unchanged_new = { mods = "DIM" }
diff_highlight.changed_old = { fg = "red" }
diff_highlight.changed_new = { fg = "green" }

syntax_highlight.enabled = true
syntax_highlight.attribute = { fg = "yellow" }
syntax_highlight.comment = { fg = "gray" }
syntax_highlight.constant_builtin = {}
syntax_highlight.constant = {}
syntax_highlight.constructor = {}
syntax_highlight.embedded = {}
syntax_highlight.function_builtin = { fg = "cyan" }
syntax_highlight.function = { fg = "blue" }
syntax_highlight.keyword = { fg = "magenta" }
syntax_highlight.number = {}
syntax_highlight.module = { fg = "cyan" }
syntax_highlight.property = {}
syntax_highlight.operator = {}
syntax_highlight.punctuation_bracket = {}
syntax_highlight.punctuation_delimiter = {}
syntax_highlight.string_special = { fg = "yellow" }
syntax_highlight.string = { fg = "yellow" }
syntax_highlight.tag = {}
syntax_highlight.type = { fg = "yellow" }
syntax_highlight.type_builtin = { fg = "yellow" }
syntax_highlight.variable_builtin = {}
syntax_highlight.variable_parameter = {}

picker.prompt = { fg = "cyan" }
picker.info = { mods = "DIM" }
picker.selection_line = { mods = "BOLD" }
picker.matched = { fg = "yellow", mods = "BOLD" }

cursor = { symbol = "▌", fg = "blue" }
selection_bar = { symbol = "▌", fg = "blue", mods = "DIM" }
selection_line = { mods = "BOLD" }
# You may want to set `selection_area.bg` to a nice background color.
# Looks horrible with regular terminal colors, so is therefore not set.
selection_area = {}

hash = { fg = "yellow" }

# What the interactive rebase will do with each commit, where that isn't just
# picking it.
rebase_todo.reword = { fg = "blue", mods = "BOLD" }
rebase_todo.edit = { fg = "magenta", mods = "BOLD" }
rebase_todo.squash = { fg = "cyan", mods = "BOLD" }
rebase_todo.fixup = { fg = "yellow", mods = "BOLD" }
rebase_todo.drop = { fg = "red", mods = "BOLD" }

branch = { fg = "green" }
remote = { fg = "red" }
tag = { fg = "yellow" }

blame.line_num = { mods = "DIM" }
blame.code_line = { mods = "DIM" }

[bindings]
root.quit = ["q", "esc"]
root.refresh = ["g+r"]
root.toggle_section = ["tab"]
root.toggle_all_sections = ["backtab"]
root.diff_context = ["U"]
root.move_up = ["k", "up"]
root.move_down = ["j", "down"]
root.move_up_line = ["ctrl+k", "ctrl+up"]
root.move_down_line = ["ctrl+j", "ctrl+down"]
# Reach the selection over a run of diff lines, to stage / unstage / discard /
# reverse them together. It stays within one hunk, which is as far as a single
# patch reaches. Any other movement drops the selection.
root.extend_selection_up = ["shift+up"]
root.extend_selection_down = ["shift+down"]
root.move_prev_section = ["alt+k", "alt+up"]
root.move_next_section = ["alt+j", "alt+down"]
root.move_parent_section = ["alt+h", "alt+left"]
root.half_page_up = ["ctrl+u"]
root.half_page_down = ["ctrl+d"]
root.full_page_up = ["pageup", "backspace"]
root.full_page_down = ["pagedown", "space"]
root.move_top = ["g+g"]
root.move_bottom = ["G"]
root.scroll_view_up = ["ctrl+y"]
root.scroll_view_down = ["ctrl+e"]
root.show_refs = ["Y"]
root.show = ["enter"]
root.discard = ["K"]
root.stage = ["s"]
root.unstage = ["u"]
root.apply = ["a"]
root.reverse = ["v"]
root.copy_hash = ["y"]
root.blame = ["B"]
# Turn a renderer feature (side-by-side, line numbers, ...) on or off in place.
root.renderer_features = ["|"]

picker.next = ["down", "ctrl+n", "tab"]
picker.previous = ["up", "ctrl+p", "backtab"]
picker.done = ["enter"]
picker.cancel = ["esc", "ctrl+c"]

root.help_menu = ["h", "?"]
help_menu.quit = ["q", "h", "?", "esc"]

root.branch_menu = ["b"]
branch_menu.checkout = ["b"]
branch_menu.checkout_new_branch = ["c"]
branch_menu.spinoff = ["s"]
branch_menu.rename = ["m"]
branch_menu.delete = ["K"]
branch_menu.quit = ["q", "esc"]

root.commit_menu = ["c"]
commit_menu.--all = ["-a"]
commit_menu.--allow-empty = ["-e"]
commit_menu.--verbose = ["-v"]
commit_menu.--no-verify = ["-n"]
commit_menu.--reset-author = ["-R"]
commit_menu.--signoff = ["-s"]
commit_menu.commit = ["c"]
commit_menu.commit_amend = ["a"]
commit_menu.commit_extend = ["e"]
commit_menu.commit_fixup = ["f"]
commit_menu.commit_instant_fixup = ["F"]
commit_menu.quit = ["q", "esc"]

# The log view opened to choose a commit (by `commit_menu.commit_fixup` and
# `commit_menu.commit_instant_fixup`). Navigation is as in the log view.
commit_picker.select_commit = ["enter"]
commit_picker.move_up = ["k", "up"]
commit_picker.move_down = ["j", "down"]
commit_picker.move_prev_section = ["alt+k", "alt+up"]
commit_picker.move_next_section = ["alt+j", "alt+down"]
commit_picker.move_top = ["g+g"]
commit_picker.move_bottom = ["G"]
commit_picker.half_page_up = ["ctrl+u"]
commit_picker.half_page_down = ["ctrl+d"]
commit_picker.scroll_view_up = ["ctrl+y"]
commit_picker.scroll_view_down = ["ctrl+e"]
commit_picker.toggle_section = ["tab"]
commit_picker.toggle_menu = ["h", "?"]
commit_picker.quit = ["q", "esc"]

root.fetch_menu = ["f"]
fetch_menu.--prune = ["-p"]
fetch_menu.--tags = ["-t"]
fetch_menu.fetch_all = ["a"]
fetch_menu.quit = ["q", "esc"]
fetch_menu.fetch_elsewhere = ["e"]
fetch_menu.fetch_push_remote = ["p"]
fetch_menu.fetch_upstream = ["u"]

root.log_menu = ["l"]
log_menu.log_current = ["l"]
log_menu.log_other = ["o"]
log_menu.quit = ["q", "esc"]
log_menu.-n = ["-n"]
log_menu.--grep = ["-F"]

root.merge_menu = ["m"]
merge_menu.--ff-only = ["-f"]
merge_menu.--no-ff = ["-n"]
merge_menu.merge_abort = ["a"]
merge_menu.merge_continue = ["c"]
merge_menu.merge = ["m"]
merge_menu.quit = ["q", "<esc>"]

root.pull_menu = ["F"]
pull_menu.--rebase = ["-r"]
pull_menu.pull_from_push_remote = ["p"]
pull_menu.pull_from_upstream = ["u"]
pull_menu.pull_from_elsewhere = ["e"]
pull_menu.quit = ["q", "esc"]

root.push_menu = ["P"]
push_menu.--force-with-lease = ["-f"]
push_menu.--force = ["-F"]
