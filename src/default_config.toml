rebase_menu.--autosquash = ["-a"]
rebase_menu.--autostash = ["-A"]
rebase_menu.--interactive = ["-i"]
rebase_menu.--no-verify = ["-h"]
rebase_menu.rebase_interactive = ["i"]
rebase_menu.rebase_abort = ["a"]
rebase_menu.rebase_continue = ["c"]
rebase_menu.rebase_elsewhere = ["e"]
rebase_menu.rebase_autosquash = ["f"]
rebase_menu.quit = ["q", "esc"]

# The interactive rebase todo screen (opened by `rebase_menu.rebase_interactive`).
# It has its own keymap: single keys re-mark the selected commit and alt+up /
# alt+down reorder it. Nothing runs until `rebase_todo_start`.
rebase_todo.rebase_todo_pick = ["p"]
rebase_todo.rebase_todo_reword = ["r"]
rebase_todo.rebase_todo_edit = ["e"]
rebase_todo.rebase_todo_squash = ["s"]
rebase_todo.rebase_todo_fixup = ["f"]
rebase_todo.rebase_todo_drop = ["d"]
rebase_todo.rebase_todo_move_up = ["alt+k", "alt+up"]
rebase_todo.rebase_todo_move_down = ["alt+j", "alt+down"]
rebase_todo.rebase_todo_start = ["enter"]
# Only when git is waiting on gitu as its sequence editor: leaving (`quit`)
# lets git carry on with the list it wrote, this stops the rebase instead.
rebase_todo.rebase_todo_abort = ["Q"]
rebase_todo.move_up = ["k", "up"]
rebase_todo.move_down = ["j", "down"]
rebase_todo.move_top = ["g+g"]
rebase_todo.move_bottom = ["G"]
