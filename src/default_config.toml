# This file contains Gitu's default configuration.
# It is possible to override settings with an equivalent file at:
# `~/.config/gitu/config.toml`
# and to override both in git config's `delta-tui` section, e.g.
#   [delta-tui]
#       start-folded = true
#   [delta-tui "style"]
#       hunk-header = bold blue

[general]
always_show_help.enabled = false
confirm_quit.enabled = false
# Sets initially collapsed sections in the editor. e.g.:
# collapsed_sections = ["untracked", "recent_commits", "branch_status"]
collapsed_sections = []
refresh_on_file_change.enabled = true
stash_list_limit = 10
recent_commits_limit = 10
log_author_width = 15
mouse_support = false
mouse_scroll_lines = 3

# The most input Gitu will read, whether piped to it as a pager or produced by
# a command it puts again. Input is read in one pass before the first frame, so
# without a limit an accidental `git log -p` over a whole history shows nothing
# until all of it has been read and rendered.
max_input_bytes = 2_000_000

# The branch section is 'Branch: {name}' over a line placing the branch
# relative to its upstream. Off, it is the branch name alone.
verbose_branch_status = true

# Files to drop from a paged view (gitu as git's pager), as if the patch never had
# them. The wildcards are git's: `*.pb.go` matches at any depth, and naming a
# directory hides its subtree. `&` says which files to show while reading, and
# `:` shows the pathspecs these became. e.g.:
#   hide = ["*.pb.go", "*_test.go", "vendor"]
hide = []

# Stop the cursor on a diff's unchanged lines too, as reading a patch line by
# line wants. Nothing can be staged there; off, the cursor skips them.
visit_context_lines = true

# Open the status screen on the first unstaged file, or the first staged one
# when nothing is unstaged; off, it opens at the top.
status_cursor_on_changes = true

# Renderer features that `renderer_features` offers, to turn on and off while
# viewing a diff. They are passed to the renderer as DELTA_FEATURES=+<names>,
# which delta adds to the features your own git config already sets: your
# configuration stays the base and this is only an overlay on it, held for the
# session and never written to disk.
#
# Any feature you have defined in git config as `[delta "name"]` can be named
# here alongside delta's built-in ones, singly or by a pattern: `*` matches any
# run of characters and `?` any one, so "*" offers every feature defined in git
# config, including any themes included there. A pattern matches only those,
# not delta's built-in features. A feature is free to restructure the diff
# however it likes: Gitu maps each rendered row back to its patch line from the
# metadata the renderer emits, not from how the row looks.
diff_renderer.features = ["side-by-side", "line-numbers", "plus-minus-markers", "*"]

# Top-level keys that toggle features, run commands or open views (`commands`
# and `views` below), by name. A key already bound at the top level is refused. Feature keys in your
# config replace these, rather than adding to them. In the `renderer_features`
# list, a letter sets the selected feature's or command's key, the same letter
# again unsets it, and Gitu writes them all here.
diff_renderer.feature_keys = { side-by-side = "S", line-numbers = "L" }

# The theme overlaid on your delta configuration, after the features above, as
# `renderer_themes` sets it. A theme is a feature defined in git config that
# sets `dark` or `light`, as delta defines one. `renderer_themes` writes your
# choice to git config's delta-tui section, not here.
# diff_renderer.theme = "my-theme"
# delta's builtin features to offer as themes too, after those in git config,
# e.g. ["diff-so-fancy"].
diff_renderer.builtin_themes = []

# Arguments given to the `git log` Gitu runs for the log view (`l l`, `l o`),
# e.g. a pretty format of your own:
#   log_args = ["--stat", "--pretty=commit-format"]
# A commit is one cursor stop only where the renderer marks it, as delta does
# for rows matching its `commit-regex`. `git log` typed at the command line
# takes git's own config instead (`format.pretty`).
log_args = []

# Arguments given to the `git show` Gitu runs for a commit it opens (enter on a
# commit, `gitu show`), e.g. a pretty format of your own:
#   show_args = ["--pretty=commit-format-full"]
# `git show` typed at the command line takes git's own config instead
# (`format.pretty`).
show_args = []

# What heads each file of a patch, folded or not: the renderer's file header
# ("delta"), or the file's line of a diffstat ("stat"). Gitu counts the stat from the patch rather than asking
# git for one, which would delay the first screen of a large diff. Its columns
# are laid out to fit the files drawn so far, so they can shift once the rest of
# a long diff has arrived.
file_header = "delta"

# Run no command that changes the repository (stage, discard, apply, commit,
# rebase, fetch, ...), and hide them, and save nothing chosen in-session (a
# theme, feature keys, prompt history). "auto" is read-only in a repository jj
# also manages, one with a `.jj` directory, where a git command can contradict
# jj's own state; otherwise true or false.
read_only = "auto"

# Whether a patch of more than one file that does not fit on one screen starts
# with its files folded, in every view of one: `git diff`, `git show`, `git log
# -p`, and a commit opened from the log. A patch still arriving when the first
# screen is drawn is taken not to fit.
start_folded = false

# Shell commands, by name, that a key from `diff_renderer.feature_keys` runs,
# as `renderer_features` lists them. `{commit}`, `{file}` and `{branch}` are
# filled in, quoted for the shell, from what is under the cursor, and
# `{command}` with the git command the screen is showing, as `:` shows it; a
# command using one that is not there is not run. `COLUMNS` and
# `DELTA_FEATURES` are set as gitu sets them for the delta it draws with, so
# that `{command} --color=always | delta` draws as delta draws the screen, but
# without what gitu adds: folds, counted stat rows, hidden files. It runs in
# the repository's root, while gitu stays usable, as a fetch does, and the
# screens are rebuilt when it exits. Its output is not shown; one that fails
# says so, with its exit code.
# In git config:
#   [delta-tui "general.commands"]
#       open-pr = gh pr view --web {commit}
commands = {}

# git commands, by name, that a key from `diff_renderer.feature_keys` opens as
# a screen on top of the one it is pressed on, as enter opens a commit; q goes
# back. Filled in as commands are, but not run by a shell: a view is a `git
# diff`, `git show` or `git log`, run again after each change as `:` runs an
# edited command. `{command}` is a word of its own, standing for the words of
# the git command shown, so that a view can change it. In git config:
#   [delta-tui "general.views"]
#       diff-since = git diff {commit}...
#       word-diff = {command} --word-diff
views = {}

# When to prompt for discard confirmation. Options:
# "line"  - always prompt even for individual lines (default),
# "hunk"  - prompt for files and hunks,
# "file"  - only prompt when discarding whole files,
# "never" - never prompt when discarding.
confirm_discard = "line"

[style]
# fg / bg can be either of:
# - a hex value: "#707070"
# - an ansi color name: "light blue"
# - an ansi color index: "255"
# - "reset" will set the terminal's default foreground / background color.

# 'mods' can be any combination of (multiple values separated by '|'):
# "BOLD|DIM|ITALIC|UNDERLINED|SLOW_BLINK|RAPID_BLINK|REVERSED|HIDDEN|CROSSED_OUT"

# Example style config values:
# section_header = { fg = "#808080" }
# section_header = { bg = "light green", mods = "UNDERLINED|ITALIC" }

separator = { mods = "DIM" }

info_msg = { fg = "green", mods = "BOLD" }
error_msg = { fg = "red", mods = "BOLD" }
command = { fg = "blue", mods = "BOLD" }

menu.heading = { fg = "blue", mods = "BOLD" }
menu.key = { fg = "magenta" }
menu.active_arg = { fg = "light red", mods = "BOLD" }
menu.inactive_arg = {}

prompt = { fg = "cyan", mods = "DIM" }

section_header = { fg = "yellow" }
file_header = { fg = "magenta" }
hunk_header = { fg = "blue" }


picker.prompt = { fg = "cyan" }
picker.info = { mods = "DIM" }
picker.selection_line = { mods = "BOLD" }
picker.matched = { fg = "yellow", mods = "BOLD" }

search_match = { mods = "REVERSED" }

cursor = { symbol = "▌", fg = "blue" }
selection_bar = { symbol = "▌", fg = "blue", mods = "DIM" }
selection_line = { mods = "BOLD" }
# You may want to set `selection_area.bg` to a nice background color.
# Looks horrible with regular terminal colors, so is therefore not set.
selection_area = {}

hash = { fg = "yellow" }

# What the interactive rebase will do with each commit, where that isn't just
# picking it.
rebase_todo.reword = { fg = "blue", mods = "BOLD" }
rebase_todo.edit = { fg = "magenta", mods = "BOLD" }
rebase_todo.squash = { fg = "cyan", mods = "BOLD" }
rebase_todo.fixup = { fg = "yellow", mods = "BOLD" }
rebase_todo.drop = { fg = "red", mods = "BOLD" }

branch = { fg = "green" }
remote = { fg = "red" }
tag = { fg = "yellow" }
author = { fg = "magenta" }
age = { mods = "DIM" }

blame.line_num = { mods = "DIM" }
blame.code_line = { mods = "DIM" }

[bindings]
root.quit = ["q", "esc"]
# Fold the file or hunk unfolded on this screen that the cursor is on or in.
# Otherwise like quit, but on the first screen it does nothing rather than leave
# gitu.
root.fold_or_back = ["left"]
root.refresh = ["g+r"]
root.suspend = ["ctrl+z"]
# Go to the status screen, leaving the screen gitu was started on underneath.
root.status = ["g+s"]
root.toggle_section = ["tab"]
root.toggle_all_sections = ["shift+tab"]
root.diff_context = ["U"]
# Widen or narrow the context by a power of two: from git's 3, to 4, 8, 16, ...
root.wider_diff_context = ["+"]
root.narrower_diff_context = ["-"]
# Edit the git command the view is the output of, and ask it again.
root.edit_git_command = [":"]
# Drop the file whose header is under the cursor from the view, or say which
# files to show at all: `src !*_test.go` limits the view to src and hides its
# tests.
root.hide_file = ["d"]
root.file_patterns = ["&"]
# As in less, j, k and the arrow keys move a line at a time, through a diff's
# lines too. With ctrl they skip over a diff's lines.
root.move_up_line = ["k", "up"]
root.move_down_line = ["j", "down"]
root.move_up = ["ctrl+k", "ctrl+up"]
root.move_down = ["ctrl+j", "ctrl+down"]
# Reach the selection over a run of diff lines, to stage / unstage / discard /
# reverse them together. It stays within one hunk, which is as far as a single
# patch reaches. Any other movement drops the selection.
root.extend_selection_up = ["shift+up"]
root.extend_selection_down = ["shift+down"]
root.move_prev_section = ["alt+k", "alt+up"]
root.move_next_section = ["alt+j", "alt+down"]
root.move_parent_section = ["alt+h", "alt+left"]
root.half_page_up = ["ctrl+u"]
root.half_page_down = ["ctrl+d"]
root.full_page_up = ["pageup", "backspace"]
root.full_page_down = ["pagedown", "space"]
root.move_top = ["g+g"]
root.move_bottom = ["G"]
root.scroll_view_up = ["ctrl+y"]
root.scroll_view_down = ["ctrl+e"]
root.search = ["/"]
root.search_backward = []
root.search_next = ["n"]
root.search_previous = ["N"]
root.show_refs = ["Y"]
# Enter opens a file or hunk in the editor; right stays in gitu, unfolding a
# folded file or hunk instead.
root.show = ["enter"]
root.show_or_unfold = ["right"]
root.discard = ["K"]
root.stage = ["s"]
root.unstage = ["u"]
root.apply = ["a"]
root.reverse = ["v"]
root.copy_hash = ["y"]
root.blame = ["B"]
# Enable or disable a renderer feature (side-by-side, line numbers, ...) in place.
# In the list, space enables or disables the selected feature and keeps the list
# open, enter does so and closes it, and a letter sets its key.
root.renderer_features = ["H"]
# Move through delta's themes for the mode it renders in, light or dark,
# rendering the screen with each. A digit switches to the theme of that number,
# 0 being none, so that two can be compared; a theme after the ninth has no
# digit. The list (`picker.toggle_list`) has them all.
root.renderer_themes = ["T"]

picker.next = ["down", "ctrl+n", "tab"]
picker.previous = ["up", "ctrl+p", "shift+tab"]
picker.done = ["enter"]
picker.cancel = ["esc", "ctrl+c"]
# In theme mode, switch between the one row showing the theme on screen and the
# list of every theme, where typing searches them.
picker.toggle_list = ["ctrl+l"]
# Cancel in theme mode's one row, where letters are not typed, and in the
# `renderer_features` list, where a letter sets a key.
picker.quit = ["q"]

root.help_menu = ["h", "?"]
help_menu.quit = ["q", "h", "?", "esc"]

root.branch_menu = ["b"]
branch_menu.checkout = ["b"]
branch_menu.checkout_new_branch = ["c"]
branch_menu.spinoff = ["s"]
branch_menu.rename = ["m"]
branch_menu.delete = ["K"]
branch_menu.quit = ["q", "esc", "left"]

root.commit_menu = ["c"]
commit_menu.--all = ["-a"]
commit_menu.--allow-empty = ["-e"]
commit_menu.--verbose = ["-v"]
commit_menu.--no-verify = ["-n"]
commit_menu.--reset-author = ["-R"]
commit_menu.--signoff = ["-s"]
commit_menu.commit = ["c"]
commit_menu.commit_amend = ["a"]
commit_menu.commit_extend = ["e"]
commit_menu.commit_fixup = ["f"]
commit_menu.commit_instant_fixup = ["F"]
commit_menu.quit = ["q", "esc", "left"]

# The log view opened to choose a commit (by `commit_menu.commit_fixup` and
# `commit_menu.commit_instant_fixup`). Navigation is as in the log view.
commit_picker.select_commit = ["enter"]
commit_picker.move_up = ["k", "up"]
commit_picker.move_down = ["j", "down"]
commit_picker.move_prev_section = ["alt+k", "alt+up"]
commit_picker.move_next_section = ["alt+j", "alt+down"]
commit_picker.move_top = ["g+g"]
commit_picker.move_bottom = ["G"]
commit_picker.half_page_up = ["ctrl+u"]
